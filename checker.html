function blocks(d){

 a('21:00','24:00','o','Сон');
 L.sort((x,y)=>x[0]-y[0]);const R=[];let c=0;

 if(S.wk){S.hist=S.hist||{};S.hist[S.wk.m]=S.wk;S.carry=S.wk.done.map((x,i)=>x?null:{n:i+1,t:S.wk.title[i],s:S.wk.step[i],c:S.wk.dec[i]}).filter(c=>c&&(c.c=='carry'||c.c=='split'))}
 S.wk=blank(m);save()}
const SL=[0,5,6,7,8,9];

 if(c>=3)n++;else if(i==0)continue;else if(i-last>=7&&S.d[k]){last=i}else break}return n};

function vNow(){
 const n=new Date(),m=n.getHours()*60+n.getMinutes(),k=key(n),L=blocks(n),i=Math.max(0,L.findIndex(b=>m>=b[0]&&m<b[1])),b=L[i],nx=L[i+1]||[300,325,'g','Подъём, вода, разминка'],d=D(k),c=cn(k),ch=core(k),W=S.wk,tk=d.tk||['','',''],td=d.td||[0,0,0],nt=tk.filter(Boolean).length,wd=(n.getDay()+6)%7;
 document.documentElement.style.setProperty('--c',K[b[2]]);

 ${d.min?'':`<div class="big">${b[3]}</div><div class="mu">${rng}, осталось ${left>=60?(left/60|0)+' ч '+left%60+' мин':left+' мин'}</div><div class="bar"><i style="width:${pct}%"></i></div>`}
 <p class="cta">${esc(cta)}</p>
 ${(!d.min)?`<div class="nx">Дальше: ${F(nx[0])} ${nx[3]}</div>`:''}
 ${pri?`<button class="btn pri" data-a="tab" data-v="${pri[0]}"><b>${pri[1]}</b><small>${pri[2]}</small></button>`:''}
 ${((b[2]=='b'||(!d.act&&m<400))&&!d.min)?`<input class="inp" id="act" placeholder="Бизнес-действие на сегодня" value="${esc(d.act)}">`:''}

  <div class="chip pr ${ch[3]?'on':''}"><button class="f" data-a="meal" data-v="1">Еда<b>${d.meals} из 4</b></button><button class="m" data-a="meal" data-v="-1">−</button></div></div>
 <button class="btn" data-a="tab" data-v="tk" style="width:100%;text-align:left;margin-top:.7rem">${nt?'Задачи дня: '+td.filter((x,i)=>x&&tk[i]).length+' из '+nt:'Записать задачи дня'} · неделя ${W.done.filter(Boolean).length} из 7</button>
 <div class="sec"><button data-a="t5">${T>Date.now()?'<span id="tm"></span>':'5 минут'}</button><button data-a="tr">Тянет в мусор</button><button data-a="min" class="${d.min?'on':''}">${d.min?'Обычный день':'Плохой день'}</button>${(wd>1&&wd<5)?`<button data-a="early">Пара: ${early?'8:00':'9:45'}</button>`:''}</div>
 ${(wd>1&&wd<5)?'<div class="cap">'+(early?'Пара в 8:00: универ с 7:10, утреннего бизнес-блока нет':'Пара в 9:45: бизнес 6:40–7:45, универ с 8:50')+'</div>':''}
 ${TR?`<div class="card" style="padding:.8rem 1rem;margin-top:.8rem"><b>Если тянет в мусор</b><ul>${TRASH.map(x=>'<li>'+x+'</li>').join('')}</ul><b>Если нечего делать</b><ul>${FREE.map(x=>'<li>'+x+'</li>').join('')}</ul><button class="btn" data-a="tr">Закрыть</button></div>`:''}
 <h2>Неделя · серия ${strk()} дн.</h2><div class="wk">${wk}</div><div class="cap">Пропуск паузит серию, а не обнуляет.</div>`}

function vTk(){
 const n=new Date(),k=key(n),d=D(k),W=S.wk,wd=(n.getDay()+6)%7,td=d.td||[0,0,0],tk=d.tk||['','',''],c=W.done.filter(Boolean).length,dn=td.filter((x,i)=>x&&tk[i]).length;
 const rows=W.done.map((x,i)=>{const hang=!x&&wd>=3;
  return `<div class="li"><button class="ckw" data-a="wd" data-v="${i}"><span class="ck ${x?'on':''}">${x?'✓':i+1}</span></button><div class="tt">${W.title[i]?esc(W.title[i]):'<span class="mu">Задача '+(i+1)+'</span>'}`
  +(hang?`<div class="hg">висит ${wd} дн.</div><details><summary class="mu">Разбить на шаг в 2 минуты</summary><input class="inp st" data-i="${i}" placeholder="Первый шаг" value="${esc(W.step[i])}"></details>`:(W.step[i]&&!x?`<div class="mu">Шаг: ${esc(W.step[i])}</div>`:''))
  +((wd==6&&!x)?`<div class="seg j rv">${[['carry','Перенести'],['split','Разбить'],['drop','Убрать']].map(([v,t])=>`<button data-a="dec" data-i="${i}" data-v="${v}" class="${W.dec[i]==v?'on q2':''}">${t}</button>`).join('')}</div>`:'')+'</div></div>'}).join('');
 const dr=[0,1,2].map(i=>`<div class="li"><button class="ckw" data-a="dt" data-v="${i}"><span class="ck ${td[i]?'on':''}">${td[i]?'✓':''}</span></button><input class="gi dtk" data-i="${i}" placeholder="Задача дня ${i+1}" value="${esc(tk[i])}"></div>`).join('');
 return `<div class="sh"><span>Неделя</span><span>${c} из 7</span></div><div class="card">${rows}</div>
 ${wd==6?'<div class="cap" style="margin:.5rem .2rem">Воскресенье: у каждой невыполненной выбери — перенести, разбить или убрать.</div>':''}
 ${(S.carry&&S.carry.length)?`<div class="cap" style="margin:.5rem .2rem">С прошлой недели: ${S.carry.map(x=>'№'+x.n+(x.t?' '+esc(x.t):'')+(x.s?', шаг: '+esc(x.s):'')).join('; ')}</div>`:''}
 <div class="sh"><span>Сегодня</span><span>${dn} из ${tk.filter(Boolean).length||3}</span></div><div class="card">${dr}</div>
 <div class="lks"><a class="lk" href="shortcuts://run-shortcut?name=%D0%9D%D0%B5%D0%B4%D0%B5%D0%BB%D1%8F">Открыть Напоминания</a><details><summary class="lk">Вставить названия недели</summary><textarea id="im" class="inp" rows="7" placeholder="По строке на задачу"></textarea><div class="row2"><button class="btn" data-a="imp">Вставить</button></div></details></div>`}

const MDESC=['Сдвинь ползунок','Совсем плохо','Очень тяжело','Тяжело, многое мешало','Так себе','Средне','Нормально','Хороший день','Очень хороший','Отличный','Лучший, горжусь'];
function vEve(){
 const k=key(new Date()),d=D(k),on=(f,v)=>d[f]==v&&(v!==0||(S.d[k]&&f in S.d[k]));
 const R=(l,f,o,cap,st)=>`<div class="row"><div class="lb">${l}</div><div class="seg ${st}">${o.map(([t,v,q,h])=>`<button data-a="s" data-f="${f}" data-v="${v}" class="${on(f,v)?'on q'+q:''}">${t}${h?'<small>'+h+'</small>':''}</button>`).join('')}</div>${cap?'<div class="cap">'+cap+'</div>':''}</div>`;
 return `<div class="big" style="font-size:1.7rem">Вечер, минута</div>
 ${R('Утро 5:00–6:30','morn',[['нет',0,0,'0–2'],['частично',1,1,'3–4'],['да',2,2,'5–6']],'Сколько из 6 пунктов: разминка, вижн, тетрадь, стена, психология, Anki','j')}
 ${R('Сон прошлой ночью, часов','sl',[['≤4',4,0],[5,5,1],[6,6,1],[7,7,2],[8,8,2],[9,9,2]],'7 и больше — норма','o')}
 ${R('Стена, минут','wall',[[0,0,0],[10,10,2],[20,20,2],[30,30,2],[60,60,2]],'10 и больше — зачёт','o')}
 ${R('Бизнес','biz',[['нет',0,0],['да',1,2]],'Да — сделал своё записанное действие, минимум 10 минут','j')}
 ${R('Домашка','hw',[['нет',0,0,'до 30%'],['частично',1,1,'30–79%'],['да',2,2,'80%+']],'Доля запланированного на день. Например, 2 помодоро из 3 — частично','j')}
 ${R('Еда, приёмов пищи','meals',[[0,0,0],[1,1,0],[2,2,0],[3,3,1],[4,4,2],[5,5,2]],'4 и больше — да, 3 — частично, 2 и меньше — нет','o')}
 <div class="row"><div class="lb">Намазы</div><div class="cnt"><button class="btn" data-a="pr" data-v="-1">−</button><span>${d.pr} из 5</span><button class="btn" data-a="pr" data-v="1">+</button></div></div>
 <div class="row"><div class="lb">Каким был день</div><input type="range" id="mood" min="0" max="10" step="1" value="${d.sc}"><div class="cap" id="md">${d.sc?d.sc+' · ':''}${MDESC[d.sc]}</div></div>
 <input class="inp" id="nt" placeholder="Что сработало или мешало, по желанию" value="${esc(d.note)}">
 <div class="row2"><button class="btn ${d.int?'on':''}" data-a="int">${d.int?'Прервали: да':'Прервали: нет'}</button><button class="btn" data-a="evd">Готово</button></div>`}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function exp(){const ks=Object.keys(S.d).sort();
 return 'ЧЕКЕР, дней: '+ks.length+'\nдата|нед|ядро|бизнес|намаз|сон|приёмов еды|утро 0-2|стена|дз 0-2|оценка 0-10|прервали|плохой день|заметка|задачи дня\n'+ks.map(k=>{const d=D(k);
 return[k,isA(new Date(k+'T12:00'))?'A':'B',cn(k)+'/4',d.biz,d.pr,d.sl,d.meals,d.morn,d.wall,d.hw,d.sc,d.int,d.min,(d.note||'').replace(/\|/g,'/'),(d.td||[]).filter((x,i)=>x&&(d.tk||[])[i]).length+'/'+(d.tk||[]).filter(Boolean).length].join('|')}).join('\n')+'\nНЕДЕЛИ (начало|сделано|решения)\n'+[...Object.values(S.hist||{}),S.wk].map(w=>w.m+'|'+w.done.filter(Boolean).length+'/7|'+w.dec.map((x,i)=>x?(i+1)+x:'').filter(Boolean).join(',')).join('\n')}

const ITM=[['Бизнес',d=>d.biz==1?2:0],['Намаз',d=>d.pr>=5?2:d.pr>0?1:0],['Сон',d=>d.sl>=7?2:d.sl>0?1:0],['Еда',d=>d.meals>=4?2:d.meals==3?1:0],['Утро',d=>d.morn],['Домашка',d=>d.hw]];
function grid(m0){
 const W7='пн вт ср чт пт сб вс'.split(' '),td=key(new Date()),ds=[...Array(7)].map((_,j)=>{const x=new Date(m0);x.setDate(m0.getDate()+j);return key(x)});
 let h='<span></span>'+ds.map((k,j)=>`<span class="gh ${k==td?'tdy':''}">${W7[j]}</span>`).join('')+'<span></span>';
 ITM.forEach(([n,f])=>{h+=`<span class="gl">${n}</span>`+ds.map(k=>`<i class="g${S.d[k]?f(D(k)):''}"></i>`).join('')+`<span class="gt">${ds.filter(k=>S.d[k]&&f(D(k))==2).length}</span>`});
 h+='<span class="gl">День</span>'+ds.map(k=>{const m=S.d[k]?D(k).sc:0;return `<i class="m m${m?m<=3?1:m<=5?2:m==6?3:m<=8?4:5:0}">${m||''}</i>`}).join('')+'<span></span>';
 return `<div class="gr">${h}</div>`}
function vSum(){
 const n0=new Date(),m0=new Date(n0);m0.setDate(n0.getDate()-(n0.getDay()+6)%7);const m1=new Date(m0);m1.setDate(m0.getDate()-7);
 const wk=[...Array(7)].map((_,j)=>{const x=new Date(m0);x.setDate(m0.getDate()+j);return key(x)}).filter(k=>S.d[k]);
 const ks=Object.keys(S.d).sort(),rated=ks.map(D).filter(d=>d.sc>0),L=[];
 const cnt=ITM.map(([nm,f])=>[nm,wk.filter(k=>f(D(k))==2).length]);
 if(!wk.length)L.push('На этой неделе записей пока нет. Заполни вечер, и здесь появится разбор.');
 else{
  L.push(`Ядро 3 и больше из 4: ${wk.filter(k=>cn(k)>=3).length} из ${wk.length} дн. Серия: ${strk()} дн.`);
  const so=[...cnt].sort((a,b)=>b[1]-a[1]),hi=so[0],lo=so[so.length-1];
  if(hi[1]>0)L.push(`Лучше всего получается: ${hi[0].toLowerCase()} (${hi[1]} из ${wk.length} дн.)`);
  if(lo[0]!=hi[0]&&lo[1]<wk.length)L.push(`Чаще всего просаживается: ${lo[0].toLowerCase()} (${lo[1]} из ${wk.length} дн.)`);
  const ms=wk.map(k=>D(k).sc).filter(Boolean);if(ms.length)L.push('Средняя оценка дня: '+avg(ms).toFixed(1)+' из 10');
 }
 const pat=rated.length>=7?ITM.map(([nm,f])=>{const y=rated.filter(d=>f(d)==2),z=rated.filter(d=>f(d)!=2);return(y.length>1&&z.length>1)?{nm,df:avg(y.map(d=>d.sc))-avg(z.map(d=>d.sc))}:0}).filter(x=>x&&Math.abs(x.df)>=1).sort((p,q)=>Math.abs(q.df)-Math.abs(p.df))[0]:0;
 if(pat)L.push(`Совпадение: когда «${pat.nm.toLowerCase()}» закрыто, оценка дня ${pat.df>0?'выше':'ниже'} на ${Math.abs(pat.df).toFixed(1)}. Это связь, а не причина.`);
 const nts=ks.filter(k=>D(k).note).slice(-3).reverse().map(k=>`<li class="mu">${k.slice(5)}: ${esc(D(k).note)}</li>`).join('');
 return `<div class="big" style="font-size:1.7rem">Итоги</div>
 <h2>Эта неделя</h2>${grid(m0)}
 <div class="cap">Зелёный — да, жёлтый — частично, серый — нет. Число справа — сколько дней «да».</div>
 <ul class="sm">${L.map(x=>'<li>'+x+'</li>').join('')}</ul>${nts?'<h2>Заметки</h2><ul class="sm">'+nts+'</ul>':''}
 <h2>Прошлая неделя</h2>${grid(m1)}
 <div class="row2"><button class="btn" data-a="copy">Скопировать итоги</button></div>
 <details><summary class="mu">Резервная копия</summary><div class="row2"><button class="btn" data-a="bk">Скопировать копию</button></div><textarea id="rb" class="inp" rows="3" placeholder="Вставь сюда копию"></textarea><div class="row2"><button class="btn" data-a="rs">Восстановить</button></div></details>
 <details><summary class="mu">Данные для копирования</summary><pre>${esc(exp())}</pre></details>`}

function render(){wkInit();
 $('#tb').innerHTML=[['now','Сейчас'],['tk','Задачи'],['eve','Вечер'],['sum','Итоги']].map(([v,t])=>`<button data-a="tab" data-v="${v}" class="${tab==v?'on':''}">${t}</button>`).join('');
 $('#app').innerHTML=tab=='now'?vNow():tab=='tk'?vTk():tab=='eve'?vEve():vSum();tm()}
function tm(){const t=$('#tm');if(!t)return;const r=T-Date.now();if(r>0)t.textContent=P(r/6e4|0)+':'+P(r/1e3%60|0);else{T=0;render();toast('5 минут прошли. Продолжай')}}
function toast(s){const t=$('#ts');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}
async function copyT(t,m){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(m)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,v=t.dataset.v,k=key(new Date()),d=D(k);
 if(a=='s')return set(k,t.dataset.f,+v);
 ({tab:()=>{tab=v;render()},biz:()=>set(k,'biz',d.biz?0:1),pr:()=>set(k,'pr',Math.max(0,Math.min(5,d.pr+ +v))),
  slc:()=>set(k,'sl',SL[(SL.indexOf(d.sl)+1)%SL.length]),meal:()=>set(k,'meals',Math.max(0,Math.min(6,d.meals+ +v))),int:()=>set(k,'int',d.int?0:1),
  min:()=>set(k,'min',d.min?0:1),early:()=>{S.early[k]=!earlyOf(new Date());save();render()},tr:()=>{TR=!TR;render()},
  t5:()=>{T=T>Date.now()?0:Date.now()+3e5;render()},copy:()=>copyT(exp(),'Итоги скопированы'),bk:()=>copyT(JSON.stringify(S),'Копия скопирована'),
  rs:()=>{try{const o=JSON.parse($('#rb').value);if(!o||!o.d||!o.wk)throw 0;if(!confirm('Заменить все данные копией?'))return;S=o;S.early=S.early||{};save();render();toast('Данные восстановлены')}catch(e){toast('Это не похоже на копию')}},
  evd:()=>{setq(k,'ev',1);tab='now';render()},
  wd:()=>{S.wk.done[+v]=S.wk.done[+v]?0:1;save();render()},
  dec:()=>{const i=+t.dataset.i;S.wk.dec[i]=S.wk.dec[i]==v?'':v;save();render()},
  dt:()=>{const a=(d.td||[0,0,0]).slice();a[+v]=a[+v]?0:1;set(k,'td',a)},
  imp:()=>{$('#im').value.split('\n').map(x=>x.replace(/^\s*\d+[.):\-]?\s*/,'').trim()).filter(Boolean).slice(0,7).forEach((x,i)=>S.wk.title[i]=x);save();render()}})[a]()});
document.addEventListener('input',e=>{const k=key(new Date()),t=e.target,i=+t.dataset.i;
 if(t.id=='act')setq(k,'act',t.value);if(t.id=='mood'){setq(k,'sc',+t.value);$('#md').textContent=(+t.value?t.value+' · ':'')+MDESC[+t.value]}if(t.id=='nt')setq(k,'note',t.value);
 if(t.classList.contains('st')){S.wk.step[i]=t.value;save()}
 if(t.classList.contains('dtk')){const a=(D(k).tk||['','','']).slice();a[i]=t.value;setq(k,'tk',a)}});
let last='';setInterval(()=>{const n=new Date(),s=(n.getHours()*60+n.getMinutes())+tab;
 if(s!==last&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))){last=s;render()}tm()},1000);
document.addEventListener('touchstart',()=>{},{passive:true});
render();
</script></body></html>
